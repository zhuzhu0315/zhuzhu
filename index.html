<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌳 涵涵的开心树洞</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #e8eaf6 100%);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 30px;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .container {
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 28px 22px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12);
  }
  .header { text-align: center; margin-bottom: 8px; }
  .header h1 { font-size: 26px; color: #6b46c1; margin-bottom: 6px; }
  .header p { font-size: 14px; color: #888; }
  .emoji { font-size: 40px; display: block; margin-bottom: 4px; }

  .question-card {
    margin: 18px 0 6px;
    padding: 16px;
    background: #fafbff;
    border-radius: 16px;
    border: 1px solid #eee;
  }
  .question {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  button {
    padding: 11px 8px;
    border: none;
    border-radius: 12px;
    background: #edf2f7;
    cursor: pointer;
    font-size: 13.5px;
    transition: all 0.18s;
    font-family: inherit;
  }
  button:hover { background: #e2e8f0; transform: translateY(-2px); }
  button:active { transform: translateY(0); }
  button.selected {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-weight: 600;
  }
  .reply {
    margin-top: 12px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #fef9c3, #fef3c7);
    border-radius: 12px;
    color: #92400e;
    font-size: 14px;
    min-height: 20px;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.3s;
  }
  .reply.show { opacity: 1; transform: translateY(0); }

  .textarea-card { margin-top: 20px; }
  textarea {
    width: 100%;
    height: 80px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 12px;
    resize: none;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
    margin-top: 8px;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: #764ba2; }
  .submit-btn {
    margin-top: 10px;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border-radius: 14px;
  }
  .submit-btn:hover { opacity: 0.92; transform: translateY(-2px); }
  .hidden { display: none; }

  .footer { text-align: center; margin-top: 18px; font-size: 12px; color: #bbb; }
  .progress-bar { height: 6px; background: #edf2f7; border-radius: 20px; margin: 14px 0 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 20px; width: 0; transition: width 0.4s; }

  /* 运势彩蛋 */
  .fortune-card {
    margin-top: 20px;
    padding: 20px;
    background: linear-gradient(135deg, #f3e8ff, #fce7f3);
    border-radius: 16px;
    text-align: center;
    border: 1px solid #e9d5ff;
  }
  .fortune-btn {
    padding: 14px 28px;
    background: linear-gradient(135deg, #a855f7, #ec4899);
    color: white;
    font-size: 16px;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s;
    border: none;
  }
  .fortune-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 10px 25px rgba(168,85,247,0.3); }
  .fortune-btn:active { transform: translateY(0) scale(0.98); }
  .fortune-result {
    margin-top: 14px;
    padding: 14px;
    background: rgba(255,255,255,0.8);
    border-radius: 12px;
    font-size: 15px;
    color: #7c3aed;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.4s;
  }
  .fortune-result.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="emoji">🌳</span>
    <h1>涵涵的开心树洞</h1>
    <p>不开心？进来选一选，笑一个算我赢 😎</p>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <!-- 题目容器 -->
  <div id="questions"></div>

  <!-- 今日运势彩蛋 -->
  <div class="fortune-card">
    <div style="font-size:15px;color:#7c3aed;margin-bottom:10px;font-weight:600;">🔮 今日运势彩蛋</div>
    <button class="fortune-btn" onclick="getFortune()">✨ 测一下今日运势</button>
    <div class="fortune-result" id="fortuneResult"></div>
  </div>

  <!-- 树洞留言 -->
  <div class="question-card textarea-card">
    <div class="question">💌 还有啥憋不住的？写这儿！</div>
    <textarea id="msg" placeholder="写完点丢进树洞，树洞替你吃掉烦恼（反正也不会有人知道）..."></textarea>
    <button class="submit-btn" onclick="submitMsg()">丢进树洞 🌪️</button>
    <div class="reply hidden" id="msgReply"></div>
  </div>

  <div class="footer">一个用来犯傻和回血的树洞 · 不保存任何记录，纯纯快乐 🫶</div>
</div>

<script>
// ============ 12 道题目（前6题已替换为你给的版本）============
const questions = [
  {
    q: "周一早上闹钟响的那一刻，你内心是？",
    options: {
      "😭 原地去世": "别怕，你不是一个人。全世界的打工人都在这一秒一起崩溃过，这是属于我们的默契。",
      "🧟 行尸走肉": "能爬起来就已经赢了 80% 的人。剩下的 20% 还在被窝里装死。",
      "🦸 我能行": "这种正能量请分我一点，我周一还在和床谈分手。",
      "🕳️ 不想醒": "床是你永远的避风港，老板不是。再赖一分钟，算我借你的。"
    }
  },
  {
    q: "老板说"这个需求很简单，很快就好"，你？",
    options: {
      "🙂 信了": "祝你平安。简单通常指——他要改 8 遍。",
      "🤥 表面笑": "成年人的世界没有崩溃，只有"好的收到，我看一下"。",
      "📝 先要排期": "专业！先甩个文档过去，让需求在流程里迷路。",
      "🏃 想跑路": "树洞理解你。但先别跑，把工资结了再跑。"
    }
  },
  {
    q: "深夜 12 点，你突然饿了，你会？",
    options: {
      "🍜 煮泡面": "深夜泡面是灵魂的止痛药，热量算什么，明天再说明天的事。",
      "🛒 点外卖": "只要手速够快，孤独就追不上你。加个炸鸡，这是对深夜的尊重。",
      "🥦 吃草": "你在减肥？那这个选择就是对自己最大的温柔（才怪）。",
      "😴 忍着睡": "你是真的勇士。梦里什么都有，包括满汉全席。"
    }
  },
  {
    q: "周末了，你最想怎么过？",
    options: {
      "🛏️ 床是全世界": "合理。床是成年人的充电宝，躺一天就是充满 100%。",
      "🎮 肝到天亮": "快乐无罪。肝完这把，明天再说。",
      "🏞️ 出门浪": "有精神！记得拍照，朋友圈需要你。",
      "🧹 大扫除": "你是个狠人。收拾完的家，值得一杯奶茶奖励。"
    }
  },
  {
    q: "开会开到一半，你的真实状态是？",
    options: {
      "🤔 认真思考": "表面认真，实则内心在想中午吃啥。都一样，别紧张。",
      "😵 灵魂出窍": "身体在会议室，灵魂已经在楼下奶茶店排队了。",
      "✍️ 疯狂记录": "记的那些东西，散会后大概率再也不会看第二眼。",
      "🙋 积极发言": "卷王！但树洞还是想提醒你：偶尔摸鱼，有益健康。"
    }
  },
  {
    q: "钱包空了的时候，你第一反应是？",
    options: {
      "💸 我不听": "只要不查余额，钱就还在。这是玄学，也是哲学。",
      "🍚 吃土套餐": "泡面配榨菜，人生豪迈，不过一碗菜。",
      "💪 搞钱搞钱": "觉醒了！先定个小目标，比如这个月多赚 500。",
      "🤝 找朋友": "真正的朋友会在你说没钱的时候说：走，我请。"
    }
  },
  // ===== 后6题：无厘头搞笑 =====
  {
    q: "把老板换成一种食物，你选？",
    options: {
      "🍅 西红柿": "酸酸甜甜，但一炒就爆，像极了他的脾气。",
      "🥔 土豆": "看着普通，但怎么做都行——煎炒炖炸，随你折腾。",
      "🌶️ 辣椒": "碰一下就辣眼睛，开会十分钟眼泪直流。",
      "🍬 糖果": "表面甜，咬开发现是芥末馅的。"
    }
  },
  {
    q: "你突然变成了一只猫，第一件事做啥？",
    options: {
      "😴 睡16小时": "猫生信条：能躺着绝不坐着，能坐着绝不站着。",
      "📦 钻纸箱": "纸箱比你的工位舒服一万倍，别问我怎么知道的。",
      "🐟 偷鱼吃": "隔壁食堂的鱼，今天就要沦陷。",
      "👋 把杯子推下桌": "这是猫的成人礼，每个杯子都必须接受考验。"
    }
  },
  {
    q: "遇到外星人，你第一句话是？",
    options: {
      "👽 带我走": "地球太累了，火星有五险一金吗？",
      "🍜 请你吃泡面": "外交从深夜食堂开始，宇宙和平就靠这碗面。",
      "📱 能连WiFi吗": "外星人：我们有星际5G。你：那我能蹭吗？",
      "🤫 别告诉我老板": "外星人：什么老板？你：别问了，带走我吧。"
    }
  },
  {
    q: "如果哭能赚钱，你今天能赚多少？",
    options: {
      "💰 百万富翁": "早上闹钟哭一次，老板发消息哭一次，加班又哭一次。今天财务自由了。",
      "💵 刚够打车": "只哭了两滴，司机师傅说不够起步价。",
      "🪙 倒欠钱": "哭着哭着笑了，系统判定情绪不稳定，扣钱。",
      "🏦 上市了": "你的眼泪已经IPO，投资人排队认购中。"
    }
  },
  {
    q: "给你一个超能力，你选哪个？",
    options: {
      "⏰ 暂停时间": "暂停后第一件事：把老板的PPT全删了。",
      "🍔 变出食物": "深夜饿了再也不用等外卖，手一伸汉堡就来。",
      "🧠 读心术": "读完老板的心：他也不知道自己在说啥。",
      "👻 隐身": "开会直接隐身，谁也点不到我名。"
    }
  },
  {
    q: "如果情绪有颜色，今天是啥色？",
    options: {
      "🌈 彩虹色": "情绪丰富到像调色盘被打翻，但至少好看。",
      "⚫ 黑色": "今天适合当背景板，别找我，我在黑洞里。",
      "🩷 粉红色": "今天甜度超标，小心蛀牙。",
      "🟡 荧光黄": "今天的存在感爆棚，想低调都不行。"
    }
  }
];

// ============ 今日运势库 ============
const fortunes = [
  "🔮 今日运势：暴富！虽然只是梦里暴富，但梦里的你穿的是Gucci。",
  "🔮 今日运势：桃花运爆棚！不过可能是桃花瘴，小心过敏。",
  "🔮 今日运势：工作顺利！老板今天心情好，需求真的很简单（这次是真的）。",
  "🔮 今日运势：财运上升！下午会捡到一块钱，记得买张彩票。",
  "🔮 今日运势：健康运满分！今天适合运动，哪怕只是从床上走到厕所。",
  "🔮 今日运势：学业进步！考试全都会，蒙的全都对。",
  "🔮 今日运势：人缘爆表！今天所有人都会对你笑，包括陌生人。",
  "🔮 今日运势：小心水逆！今天别喝奶茶，容易洒在白衬衫上。",
  "🔮 今日运势：惊喜将至！快递会比预期早到一天，快乐加倍。",
  "🔮 今日运势：灵感爆发！今天适合创作，哪怕只是发一条有趣的朋友圈。",
  "🔮 今日运势：躺平吉日！今天做什么都顺，因为你不做什么。",
  "🔮 今日运势：口才极佳！今天吵架你一定赢，但建议别吵，微笑就好。",
  "🔮 今日运势：美食运！今天吃什么都好吃，连泡面都吃出米其林的感觉。",
  "🔮 今日运势：睡眠极佳！今晚你会秒睡，连梦都不做，一觉到天亮。",
  "🔮 今日运势：神秘力量！今天会有好事发生，但说破就不灵了，闭嘴等。",
  "🔮 今日运势：反向暴富！今天花钱如流水，但流水过后就是大海——别想了，继续搬砖。"
];

// ============ 树洞留言回复库 ============
const encouragements = [
  "你已经做得很好了，真的。允许自己偶尔摆烂，是成年人最高级的自律。",
  "今天的不开心就止于此吧，明天依旧光芒万丈，工资依旧按时到账。",
  "树洞替你把烦恼吃掉啦，现在你轻飘飘的～记得给自己买杯奶茶。",
  "别担心，宇宙的 KPI 里，你已经超额完成了今天的份。",
  "累了就休息，不是只有奔跑才算努力，发呆也是在给灵魂充电。",
  "你比自己想象的要强大得多。毕竟，你撑过了那么多个周一。",
  "生活偶尔会皮一下，但大多数时候，它还是爱你的。就像我一样。",
  "笑一下嘛～你笑起来，比工资到账那一刻还好看。"
];

// ============ 渲染题目 ============
const container = document.getElementById('questions');
let answeredCount = 0;

questions.forEach((item, idx) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.innerHTML = `
    <div class="question">
      ${idx + 1}. ${item.q}
    </div>
    <div class="options" id="opts-${idx}"></div>
    <div class="reply" id="reply-${idx}"></div>
  `;
  container.appendChild(card);

  const optsDiv = document.getElementById(`opts-${idx}`);
  Object.entries(item.options).forEach(([label, text]) => {
    const btn = document.createElement('button');
    btn.innerText = label;
    btn.onclick = () => {
      Array.from(optsDiv.children).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      const reply = document.getElementById(`reply-${idx}`);
      reply.innerText = text;
      reply.classList.add('show');
      if (!btn.dataset.counted) {
        btn.dataset.counted = '1';
        answeredCount++;
        document.getElementById('progress').style.width = (answeredCount / questions.length * 100) + '%';
      }
    };
    optsDiv.appendChild(btn);
  });
});

// ============ 今日运势 ============
function getFortune() {
  const result = document.getElementById('fortuneResult');
  const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
  result.innerText = randomFortune;
  result.classList.add('show');
}

// ============ 留言提交 ============
function submitMsg() {
  const msg = document.getElementById('msg').value.trim();
  if (!msg) {
    alert('先写点什么嘛，树洞不挑，废话也行～');
    return;
  }
  const randomReply = encouragements[Math.floor(Math.random() * encouragements.length)];
  const replyDiv = document.getElementById('msgReply');
  replyDiv.innerText = randomReply;
  replyDiv.classList.remove('hidden');
  replyDiv.classList.add('show');
  document.getElementById('msg').value = '';
}
</script>
</body>
</html>
